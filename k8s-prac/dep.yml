apiVersion: apps/v1
kind: Deployment
metadata: 
  name: notes-app-dep
  namespace: notes
  labels:
    app: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
      - name: notes-app
        image: at786/django-notes-app:latest
        ports:
        - containerPort: 8000
